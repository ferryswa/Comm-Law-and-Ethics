 */const qc=E("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),ur=[{id:"pers",label:"Press Law",short:"Press",lesson:"l1"},{id:"digital",label:"Digital Law (ITE)",short:"Digital",lesson:"l2"},{id:"etika",label:"Ethics",short:"Ethics",lesson:"l3"},{id:"risiko",label:"Editorial Risk",short:"Risk",lesson:"l4"}],It=[{id:"l1",no:"01",title:"Fundamentals of Press Law",minutes:15,competency:"pers",summary:"The framework of Law No. 40 of 1999 on the Press: press freedom, the Right of Reply and Right of Correction, the Press Council, and legal protection and criminal provisions.",refs:["uu-40-1999","mk-145-2025"],chapters:[{t:0,title:"Press freedom as a basic right",points:["Art. 4(1): press freedom is guaranteed as a basic right of citizens.","Art. 4(2): the national press is not subject to censorship, banning, or broadcast prohibition.","Art. 4(4): journalists hold the Right to Refuse (Hak Tolak) when accounting for their reporting before the law."]},{t:240,title:"Right of Reply and Right of Correction",points:["Art. 5(2) and (3): the press must serve the Right of Reply (Hak Jawab) and the Right of Correction (Hak Koreksi).","The Right of Reply lets a person respond to or refute reported facts that damage their reputation.","Art. 18(2): a press company that breaches Art. 5(1) and (2) faces a fine of up to IDR 500 million."]},{t:480,title:"The Press Council and self-regulation",points:["Art. 15: the Press Council (Dewan Pers) is independent; its members include no government representatives.","Its functions include setting and supervising the Journalism Code of Ethics.","It advises on and seeks to resolve public complaints about press coverage."]},{t:690,title:"Protecting journalists (Art. 8 and 18)",points:["Art. 8: journalists receive legal protection in carrying out their profession.","Art. 18(1): obstructing press freedom carries up to 2 years in prison or a fine of up to IDR 500 million.","Constitutional Court Decision 145/PUU-XXIII/2025: criminal or civil action against journalists may proceed only after the Right of Reply, Right of Correction, and ethics review by the Press Council."]}]},{id:"l2",no:"02",title:"Digital Journalism & the ITE Law",minutes:20,competency:"digital",summary:"How the Electronic Information and Transactions (ITE) Law evolved from 2008 to 2024, its defamation and false-news provisions, and the Constitutional Court rulings that narrow them.",refs:["uu-11-2008","uu-19-2016","uu-1-2024","mk-105-2024","mk-115-2024"],chapters:[{t:0,title:"The ITE Law: 2008, 2016, 2024",points:["Law No. 11 of 2008 was enacted on 21 April 2008.","It was first amended by Law No. 19 of 2016 (25 November 2016).","Second amendment: Law No. 1 of 2024, enacted and in force on 2 January 2024."]},{t:300,title:"From Art. 27(3) to Art. 27A",points:["Decision 50/PUU-VI/2008: the Court upheld Art. 27(3) and tied its interpretation to Articles 310 and 311 of the Criminal Code (KUHP).","Law 1/2024 moves attacks on honour or reputation to Art. 27A jo. Art. 45(4).",'Decision 105/PUU-XXII/2024: "another person" excludes government institutions, groups with a specific identity, institutions, corporations, professions, and public offices.']},{t:660,title:'False news and the meaning of "riot"',points:["Art. 28(3) of Law 1/2024 prohibits spreading false information that causes riots in society.","Decision 115/PUU-XXII/2024: a riot means a disturbance of public order in physical space, not in digital or cyber space.","Decision 78/PUU-XXI/2023: Articles 14 and 15 of Law 1/1946 (false news causing public disorder) no longer have binding legal force."]},{t:960,title:"Journalistic work in digital spaces",points:["Disputes over journalistic work go first through the Press Law mechanism and the Press Council (see Decision 145/PUU-XXIII/2025).","Good practice: keep personal accounts separate from official newsroom channels. Personal posts risk not being treated as journalistic work.","Document your verification steps. Newsroom records are evidence of good faith."]}]},{id:"l3",no:"03",title:"Journalism Code of Ethics",minutes:20,competency:"etika",summary:"The eleven articles of the Journalism Code of Ethics (KEJ, Press Council Regulation No. 6/Peraturan-DP/V/2008) and how they apply in daily reporting.",refs:["kej-2008","ppms-2012","dp-3-2024"],chapters:[{t:0,title:"Independent, accurate, balanced (Art. 1–3)",points:["Art. 1: journalists are independent and produce accurate, balanced reporting without bad faith.","Art. 2: journalists use professional methods in their work.","Art. 3: journalists test information, report in a balanced way, keep fact separate from judgemental opinion, and apply the presumption of innocence."]},{t:300,title:"Protecting identity and privacy (Art. 5 and 9)",points:["Art. 5: do not name or broadcast the identity of victims of sexual crimes, or of children who commit crimes.","Interpretation of Art. 5: a child is a person under 16 years old and unmarried.","Art. 9: respect a source's right to a private life, except in the public interest."]},{t:600,title:"Integrity and sources (Art. 6–7)",points:["Art. 6: journalists do not abuse their profession and do not accept bribes.",'Art. 7: the Right to Refuse protects sources, and journalists honour embargoes, background information, and "off the record" agreements.']},{t:870,title:"Corrections, Right of Reply, and the Press Council (Art. 10–11)",points:["Art. 10: promptly retract, correct, and fix inaccurate reports, with an apology to the audience.","Art. 11: serve the Right of Reply and Right of Correction proportionally.","The Press Council makes the final assessment of KEJ breaches; sanctions are imposed by journalist organisations and/or press companies."]}]},{id:"l4",no:"04",title:"Editorial Risk & Case Simulation",minutes:25,competency:"risiko",summary:"Map legal and ethical risk before publishing, then practise with three fictional cases based on the Cyber Media Reporting Guidelines (PPMS).",refs:["ppms-2012","kej-2008","mk-145-2025"],chapters:[{t:0,title:"Mapping editorial risk",points:["Four lenses: factual accuracy, legal risk (Press Law, ITE Law), ethics (KEJ), and impact on vulnerable people.","Escalate review for criminal allegations, children, victims of sexual violence, and ethnic, religious, or racial (SARA) issues."]},{t:360,title:"Case 1 (fictional): an unverified story",points:["PPMS: in principle, every story must be verified.","The exception applies only if the public interest is urgent, the first source is named and credible, the subject cannot be reached, and readers are told.","The notice goes at the end of the same story, in brackets and italics; verification results go in a linked update."]},{t:780,title:"Case 2 (fictional): a takedown request",points:["PPMS: a story may not be removed because of censorship by parties outside the newsroom.","Exceptions: SARA, decency, a child's future, a victim's trauma, or other grounds set by the Press Council.","A removal must state its reason and be announced. Point the complainant to the Right of Reply."]},{t:1140,title:"Case 3 (fictional): reader comments",points:["Cyber media must provide an easy-to-find complaint mechanism for user-generated content.","Reported user content that breaches the rules must be edited or removed within 2 x 24 hours of the complaint."]},{t:1380,title:"Pre-publication checklist",points:["Has everyone accused been asked for a response?","Are the identities of sexual-crime victims and child offenders protected?","Are fact and opinion clearly separated, and is a correction ready to be linked if needed?"]}]}],pm=It.reduce((e,t)=>e+t.minutes,0),J=80,we=[{id:"q1",comp:"pers",q:"Under Art. 4(2) of Law No. 40 of 1999, the national press is not subject to…",options:["Taxes and regional levies","Censorship, banning, or broadcast prohibition","Mandatory registration with the Press Council","The duty to serve the Right of Reply"],answer:1,why:"Art. 4(2) states that the national press is not subject to censorship, banning, or broadcast prohibition.",ref:"uu-40-1999"},{id:"q2",comp:"pers",q:"The right of a person to respond to or refute reported facts that damage their reputation is called…",options:["Right to Refuse (Hak Tolak)","Right of Correction (Hak Koreksi)","Right of Reply (Hak Jawab)","Copyright"],answer:2,why:"Art. 1(11) of the Press Law defines the Right of Reply. The Right of Correction fixes errors of information; the Right to Refuse protects a source’s identity.",ref:"uu-40-1999"},{id:"q3",comp:"pers",q:"A press company that fails to serve the Right of Reply (breaching Art. 5(2) of the Press Law) can be fined up to…",options:["IDR 50 million","IDR 100 million","IDR 500 million","IDR 1 billion"],answer:2,why:"Art. 18(2) of the Press Law: breaches of Art. 5(1) and (2) and Art. 13 carry a fine of up to IDR 500,000,000.",ref:"uu-40-1999"},{id:"q4",comp:"pers",q:"Which body sets and supervises the Journalism Code of Ethics?",options:["Indonesian Broadcasting Commission (KPI)","Ministry of Communication and Digital Affairs","Press Council (Dewan Pers)","Indonesian Journalists Association (PWI)"],answer:2,why:"Art. 15(2)(c) of the Press Law gives this function to the Press Council.",ref:"uu-40-1999"},{id:"q5",comp:"risiko",q:"An official feels harmed by your investigative story and plans to sue the journalist directly in a civil court. Under the Court’s reading of Art. 8 of the Press Law (Decision 145/PUU-XXIII/2025), what should come first?",options:["A formal legal warning letter to the editor-in-chief","The Right of Reply, Right of Correction, and resolution of any alleged ethics breach through the Press Council","A request to the Ministry to block access to the story","Court-annexed mediation at the district court"],answer:1,why:'The Court read "legal protection" so that criminal or civil sanctions apply only after the Right of Reply, Right of Correction, and any alleged KEJ breach are resolved through the Press Council (a restorative-justice approach).',ref:"mk-145-2025"},{id:"q6",comp:"digital",q:"Law No. 1 of 2024 is…",options:["A replacement for the Press Law","The first amendment to Law No. 11 of 2008","The second amendment to Law No. 11 of 2008 on Electronic Information and Transactions (ITE)","The Personal Data Protection Law"],answer:2,why:"Law 1/2024 is the Second Amendment to Law 11/2008 on ITE. The first amendment was Law 19/2016.",ref:"uu-1-2024"},{id:"q7",comp:"digital",q:"Following Decision 105/PUU-XXII/2024, who can NOT be the victim of an attack on honour under Art. 27A of the ITE Law?",options:["A citizen defamed on social media","An official as an individual","A government institution, institution, corporation, profession, or public office","A journalist as an individual"],answer:2,why:'The Court held that "another person" must be read as excluding government institutions, groups with a specific identity, institutions, corporations, professions, and public offices.',ref:"mk-105-2024"},{id:"q8",comp:"digital",q:'Decision 115/PUU-XXII/2024 interprets the word "riot" (kerusuhan) in Art. 28(3) of the ITE Law as…',options:["Heated debate or uproar on social media","A disturbance of public order in physical space, not in digital or cyber space","Any post that goes viral","A public complaint filed with the police"],answer:1,why:'The ruling reads "riot" as a condition that disturbs public order in physical space, not a condition in digital or cyber space.',ref:"mk-115-2024"},{id:"q9",comp:"digital",q:"In Decision 50/PUU-VI/2008 the Court upheld Art. 27(3) of the ITE Law and held that its interpretation cannot be separated from…",options:["Articles 310 and 311 of the Criminal Code (KUHP)","Art. 28E of the 1945 Constitution alone","The Journalism Code of Ethics","The Cyber Media Reporting Guidelines"],answer:0,why:"The Court tied Art. 27(3) to the general defamation offences in Articles 310 and 311 of the Criminal Code.",ref:"mk-50-2008"},{id:"q10",comp:"etika",q:"Art. 1 of the Journalism Code of Ethics says Indonesian journalists are independent and produce reporting that is…",options:["Fast, viral, and exclusive","Accurate, balanced, and without bad faith","Aligned with the owner’s interests","Approved by sources before publication"],answer:1,why:"Art. 1 KEJ: independent, accurate, balanced, and without bad faith.",ref:"kej-2008"},{id:"q11",comp:"etika",q:'The interpretation of Art. 5 KEJ (protecting the identity of child offenders) defines a "child" as a person who is…',options:["Under 18 years old","Under 16 years old and unmarried","Under 21 years old","Still in school"],answer:1,why:"Interpretation of Art. 5 KEJ: a child is a person under 16 years old and unmarried.",ref:"kej-2008"},{id:"q12",comp:"etika",q:"When a cyber medium publishes an unverified story under the PPMS exception, the notice to readers goes…",options:['On the "About Us" page',"At the end of the same story, in brackets and italics","On the newsroom’s social media","Nowhere; no notice is needed"],answer:1,why:"PPMS point 2: the notice is placed at the end of the same story, in brackets and in italics.",ref:"ppms-2012"},{id:"q13",comp:"etika",q:"Reported user-generated content (e.g. reader comments) that breaches the rules must be edited or removed within…",options:["1 x 24 hours","2 x 24 hours of receiving the complaint","7 working days","After a Press Council ruling"],answer:1,why:"PPMS: no later than 2 x 24 hours after the complaint is received.",ref:"ppms-2012"},{id:"q14",comp:"risiko",q:"Your newsroom publishes a Right of Reply from a person named in a story. Under PPMS, the reply must be…",options:["Published as a separate article with no link","Linked to the original story, with the time of publication shown","A replacement for the original story, which is then deleted","Approved by the Press Council before publication"],answer:1,why:"PPMS point 4: corrections and replies must be linked to the related story and show when they were published.",ref:"ppms-2012"},{id:"q15",comp:"risi ns the Press Council-first sequence (Decision 145/2025)","Concrete, proportionate newsroom steps"]},{id:"e3",comp:"risiko",title:"SOP for Right of Reply and takedowns",prompt:"Draft a short SOP (5–7 steps) for the digital desk to handle (a) Right of Reply requests and (b) story takedown requests. Include who decides, time limits, and how decisions are disclosed to readers.",rubric:["A Right of Reply flow linked to the original story","Takedown criteria in line with PPMS point 5","Roles, time limits, and transparency to the public"]}],So={e1:`In principle the story is not ready to publish, because the Cyber Media Reporting Guidelines require every story to be verified, especially one that could harm another party. The exception applies only when all four conditions are met: the public interest is urgent, the first source is named, credible and competent, the subject cannot be located or interviewed, and readers are told that the story still needs further verification.
